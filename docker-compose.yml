services:
  3dich:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 3dich
    restart: unless-stopped
    ports:
      - "8099:8099"
    mem_limit: 256m
    cpus: 1.5
    networks:
      - threedich_priv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8099
      - NODE_ENV=production
      - DOCS_DIR=/app/docs
      - LIBRARY_DIRS=SolidCraft=/library/solidcraft
      - AGY_KASA_UPSTREAM=http://host.docker.internal:8766
      - AGY_TOSHI_UPSTREAM=http://100.79.246.19:8767
    volumes:
      - ./docs:/app/docs:ro
      - ./server:/app/server:ro
      - /home/kasa/apps/solidcraft-kasa/workspace:/library/solidcraft:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8099/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  threedich_priv:
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.99.0/24
          gateway: 10.89.99.1
